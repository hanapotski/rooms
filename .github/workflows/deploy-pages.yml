name: Build and Deploy Twine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Tweego
        run: |
          set -euo pipefail
          TWEEGO_VERSION="2.1.1"
          curl -L "https://github.com/tmedwards/tweego/releases/download/v${TWEEGO_VERSION}/tweego-${TWEEGO_VERSION}-linux-x64.zip" -o tweego.zip
          unzip -q tweego.zip -d tweego-bin
          chmod +x tweego-bin/tweego
          echo "$PWD/tweego-bin" >> "$GITHUB_PATH"

      - name: Build project
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
